# Local PostgreSQL for development only.
# The password is NOT stored here: it is injected at runtime by `op run`
# from a 1Password reference (see .env.op).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: moneta
      POSTGRES_DB: moneta
      POSTGRES_PASSWORD: ${PGPASSWORD:?run via op run, see README}
    ports:
      # Host port 5434 -> container 5432. 5432 and 5433 are used by other
      # local Postgres containers on this machine.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No initdb mount: the schema is created ONLY by node-pg-migrate
      # (npm run migrate -- up), so there is a single source of truth.

volumes:
  pgdata:
