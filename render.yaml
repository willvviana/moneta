# Render Blueprint: one web service (Express serves the API AND the built React app, one origin)
# plus one PostgreSQL database. Create it in the Render dashboard: New > Blueprint > pick this repo.
# No secret is stored here: the database URL is wired in by Render at deploy time.

databases:
  - name: moneta-db
    databaseName: moneta
    user: moneta
    postgresMajorVersion: "16" # matches local development (docker-compose.yml)
    # FREE PLAN LIMITS (Render docs): the database expires 30 days after creation (14-day grace period,
    # then it is deleted) and has no backups. Fine for a demo; change `plan` to a paid plan to keep data.
    plan: free

services:
  - type: web
    name: moneta
    runtime: node
    # Free web services spin down after 15 minutes without traffic; the next request takes about a minute.
    plan: free
    # --include=dev is required: NODE_ENV=production (set below) also applies DURING the build, so a plain
    # `npm ci` would skip TypeScript and Vite, which the build needs (first deploy failed with "Cannot find
    # type definition file for 'vite/client'").
    buildCommand: npm --prefix frontend ci --include=dev && npm --prefix frontend run build && npm --prefix backend ci --include=dev && npm --prefix backend run build
    # Migrations run on every start, before the server listens. They are idempotent (already-applied ones
    # are skipped), and a failed migration stops the start, so the old version keeps serving.
    startCommand: cd backend && npm run migrate -- up && npm start
    # /health queries the database, so a deploy only goes live if PostgreSQL is reachable.
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # the internal connection string; used by the app and by the migrations
        fromDatabase:
          name: moneta-db
          property: connectionString
      # APP_ORIGIN is optional here: the app falls back to RENDER_EXTERNAL_URL (the service's own https URL).
      # Set it explicitly if you add a custom domain.
      #
      # Number of proxies in front of the app (Cloudflare and Render's own). Measured on 2026-10-15 after the
      # first deploy, not guessed: see docs/DECISIONS.md, "Deploying to Render".
      - key: TRUST_PROXY
        value: "3"
